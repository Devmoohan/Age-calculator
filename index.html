<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age calculator</title>
    <style>
        body{
            display:flex;
            justify-content:center;
            
        }
        .container-age{
            width:300px;
            padding:20px;
            margin-top:50px;
            background-color:rgb(38, 100, 100);
            color:white;
            border-radius:10px;
        }
        .container-age h2{
            text-align:center;
            margin-bottom:40px;
            font-family:sans-serif;

        }
        .container-age .input-control{
            text-align:center;
            width:100%;
            padding:15px 0px;
            border: 2px solid #fff;
        }
        .container-age button{
            margin-top:15px;
            width:100%;
            background-color:rgb(20, 83, 219);
            padding:14px 0px;
            border-radius:10px;
            text-align:center;
            cursor:pointer;
            border:none;
            color:white;
        }
        .container-age button:hover{
            background-color:rgb(95, 30, 30)

        }
        .container-age p{
            text-align:center;
            font-size:20px;

        }
        .container-age span{
            display:block;
            margin-top:5px;
            color:rgb(190, 80, 200 )
        }
        h2 span{
            color:red;
        }
        #result{
            color:white;
        }
    </style>

</head>
<body>
   
  <div class="container-age">
    <h2>Age <span>calculator</span></h2>
    <div class="input-control">
        <input type="date" id="myInput">
    </div>
    <button id="btn">Click</button>
    <p>You're age is: <span id="result" class="result"></span></p>
  </div>








    <script src="index.js"></script>
</body>
</html>
